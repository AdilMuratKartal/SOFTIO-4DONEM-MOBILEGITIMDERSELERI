<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urun Detay</title>
    <link rel="stylesheet" href="css/extCss.css">
</head>
<body>

    <div class="page-container flex-col">
        
        <header class="top-bar flex-row">
            <button class="nav-left" aria-label="Geri">←</button>
            <span class="brand-title">ESSENTIAL</span>
            <div class="nav-right flex-row">
                <svg viewBox="0 0 24 24" aria-label="Favori">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
                <svg viewBox="0 0 24 24" aria-label="Sepet">
                    <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <path d="M16 10a4 4 0 0 1-8 0"></path>
                </svg>
            </div>
        </header>

        <!-- Hero kısmı ürün ana tanıtım -->
        <section class="hero-box flex-row">
            <div class="hero-title flex-col">
                <h1>THE<br>ESSENTIAL<br>TEE</h1>
                <div class="hero-price">$60</div>
            </div>
            <div class="heroFoto">
                <span class="badge discount-badge">%20 İNDİRİM</span>
                <span class="badge shipping-badge">KARGO BEDAVA</span>
                <img src="ORNEKFOTOLAR2/mainFoto - Kopya.jpg" alt="heroFoto">
            </div>
        </section>

        
         <!-- 2.ürün tanıtım kısmı -->

            <section class="flex-col int-box">
                <div class="flex-row int-top">
                    <span>IN MOTION</span>
                    <span>IN MOTION</span>
                    <span>IN MOTION</span>
                </div>
                <div class="flex-row int-mid">
                    <div class="slider-foto-box">
                        <img src="ORNEKFOTOLAR2/sliderFoto1.jpg" alt="sliderFoto1">
                    </div>
                    <div class="slider-foto-box">
                        <img src="ORNEKFOTOLAR2/sliderFoto2.jpg" alt="sliderFoto1">
                    </div>
                    <div class="slider-foto-box">
                        <img src="ORNEKFOTOLAR2/sliderFoto3.jpg" alt="sliderFoto1">
                    </div>

                </div>
                <div class="flex-row int-bot">
                    <span>BLACK</span>
                    <span>IN MOTION</span>
                    <span>RIBBED COTTON</span>
                </div>
            </section>

            <!-- 3.Beden seçme -->
            <section class="size-box flex-row">
                <div>
                    SIZE SELECT:
                </div>
                <div class="buttons-box flex-row gap4">
                    <div class="flex-row gap4 center">
                        <button class="size-btn"></button>
                        <div class="btn-txt">XS</div>
                    </div>
                    <div class="flex-row gap4 center">
                        <button class="size-btn"></button>
                        <div class="btn-txt">S</div>
                    </div>
                     <div class="flex-row gap4 center">
                        <button class="size-btn"></button>
                        <div class="btn-txt">M</div>
                    </div>
                    <div class="flex-row gap4 center">
                        <button class="size-btn"></button>
                        <div class="btn-txt">L</div>
                    </div>
                        <div class="flex-row gap4 center"> 
                        <button class="size-btn"></button>
                        <div class="btn-txt">XL</div>
                    </div>
                </div>
            </section>

            <!-- 4.Content kısmı -->
            <section class="flex-row ">
                <div>
                    <p>RAW. ORGANIC. THE PUREST FORM OF THE EVERYDAY ESSENTIAL TEE. BLACK RIBBED COTTON. UNISEX FIT.</p>
                </div>
            </section>

            <!-- 5.Sepete ekleme kısmı -->
            <section class="flex-row sepet-bar">
                <div class="sepet-price-box flex-row ">
                    <div class="sepet-price discount">$60</div>
                    <div class="sepet-price">$48</div>
                </div>
                <div><button class="sepet-btn">ADD TO BAG</button> </div>
            </section>
    </div>

</body>
</html>
