        // REST Api olarak Dışardan Veri Çekme
        const kozmetikUrunleriniGetir = async () => {
            try{
                console.log("Harici Apiye Bağlanıyor");
                const response = await fetch("https://dummyjson.com/products/category/beauty");
                if(!response.ok){
                    throw new Error(`Http hatasi ${response.status}`);
                }

                const data = await response.json();//bu json() işlemide asenkronmuş promise döndürüyormuş
                console.log(`Toplam ${data.products.length} adet kozmetik ürün çekildi`);

                const vitrin = data.products.slice(0,3).map(p=>({
                    urun: p.title,
                    fiyat: p.price,
                    stok: p.stock
                }));
                console.log(vitrin);
            }catch(err){
                console.warn("Api hatasi",err.message);
            }
        }

        //kozmetikUrunleriniGetir();

        const urunleriGetir = async () => {
            try{
                console.log("Veri çekme işlemi başladi");

                const response = await fetch("https://dummyjson.com/products");
                if(!response.ok){
                    throw new Error(`Http hatasi ${response.status}`);
                }

                const data = await response.json();
                const urunler = data.products.slice(2,7).map(p => ({
                    urunAdi:p.title,
                    fiyat:p.price,
                    aciklama:p.description,
                    kategori:p.category,
                    stok:p.stock,
                    tags:[...p.tags]//şimdi neden objeyi açıp veridk eğer direk versek bu array olduğu için referans olarak değer alıcaktı ve react gibi vue gibi state yönettiğin durumlar yada tekrar istek attığın durumlarda senin önceden bunun üzerine yaptığın değişikler bir anda yok olacaktı , yada hatalar ile karşılaşacaktıns.bu durum "büyük bug'lara" ve arayüzün güncellenmemesine yol açar.
                }))
                console.table(urunler)
            }catch(err){
                console.warn("Api Bağlanti Hatasi",err.message);
            }
        }
