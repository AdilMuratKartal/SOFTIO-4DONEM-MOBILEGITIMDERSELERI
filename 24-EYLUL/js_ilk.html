        //Meydan Okuma konusu İndirimli Sepet Tutarı Hesaplayıcı
        const finalTutarHesapla = (tutar,indirimOranı) => {
            const finalTutar = tutar * (100-indirimOranı) / 100;

        //Meydan Okuma konusu şarj süresi tahmin dakika cinsinden, kaç dakikada şarj olur
        //verilecek değerler: mevcut yüzde, hedef yüzde, bataryaKW, istasyonKw
        //bataryaKw her bir dakikada kaç Kw aldığımız belli oluyormuş
        const sarjSuresi = (mevcutYuzde, hedefYuzde, bataryaKw, istasyonKw) => {
            if (mevcutYuzde === hedefYuzde) {
            return 0;
            }

            let sarjGucu;

            if (istasyonKw > bataryaKw) {
                sarjGucu = bataryaKw;
            } else {
                sarjGucu = istasyonKw;
            }

            const gerekenYuzde = hedefYuzde - mevcutYuzde;
            const gerekliEnerji = bataryaKw * (gerekenYuzde / 100);
            return (gerekliEnerji / sarjGucu) * 60;
